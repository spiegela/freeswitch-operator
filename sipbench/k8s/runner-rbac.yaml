# What the runner may do to the fleet under test, for the scenarios that require "fleet" (drain-mid-call,
# rolling-update-live-call, bad-config-stops-roll, pool-media-address, node-lost-mid-call): read the
# FreeswitchCluster and roll it, read the KamailioClusters to see whether those dispatching to it hold its list, read
# its pods' external addresses and evict them, edit the ConfigMaps it reads and put them back, cordon and uncordon
# nodes and read whether they are ready, and, for "node-blackout", start a pod on an edge node that takes the node
# off the network for a while (host network, root, NET_ADMIN: a bench-only power, for a namespace that admits
# privileged pods), read its log and delete it. Only the runner Job uses this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sipbench-runner
  labels:
    app.kubernetes.io/part-of: sipbench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sipbench-runner
  labels:
    app.kubernetes.io/part-of: sipbench
rules:
  - apiGroups: ["sip.instruments.com"]
    resources: ["freeswitchclusters"]
    verbs: ["get", "update"]
  - apiGroups: ["sip.instruments.com"]
    resources: ["kamailioclusters"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # fs_cli in a FreeSWITCH pod (crashFreeswitchOf, recoverOn). WebSocket exec is a GET; older API servers take
  # SPDY's POST, authorized as create.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sipbench-runner
  labels:
    app.kubernetes.io/part-of: sipbench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sipbench-runner
subjects:
  - kind: ServiceAccount
    name: sipbench-runner
---
# Nodes are cluster-wide: cordoning one, and reading whether it is ready, are the only cluster-scoped things the
# runner does.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sipbench-runner-nodes
  labels:
    app.kubernetes.io/part-of: sipbench
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sipbench-runner-nodes
  labels:
    app.kubernetes.io/part-of: sipbench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sipbench-runner-nodes
subjects:
  - kind: ServiceAccount
    name: sipbench-runner
