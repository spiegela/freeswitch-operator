# One bench run against the edge on a cluster: calls go to Kamailio, which dispatches them to the FreeswitchCluster.
# Created per run (kubectl create, for the generated name); hack/kind.sh bench does it and prints the result.
#
# Through Kamailio the runner can't know which FreeSWITCH node a call lands on, so there is no event socket ("esl"
# capability): scenarios that change FreeSWITCH's settings (admission-limit) skip. OPTIONS is answered by Kamailio.
#
# SIPBENCH_FLEET names the FreeswitchCluster the fleet scenarios act on (the "fleet" capability), through the
# sipbench-runner service account (runner-rbac.yaml). Empty, they skip.
#
# NET_ADMIN lets the runner impair its own traffic with tc (the "netem" capability, carrier-edge link only): it
# changes this pod's network namespace and nothing else.
#
# No "sip-trace": the edge address is the kamailio-sip Service VIP, and a call's in-dialog requests go to the
# Kamailio pod's own address (its Record-Route); sent from the INVITE's socket, as the SIP-layer impairments and
# sip checks need, they collide in conntrack with the VIP's NAT entry and are dropped. Those scenarios skip here;
# to run them, set SIPBENCH_EDGE to proxy-kamailio:5060 (the headless Service: a node's own address) and add
# sip-trace.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: sipbench-
  labels:
    app.kubernetes.io/part-of: sipbench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sipbench-runner
        app.kubernetes.io/part-of: sipbench
    spec:
      restartPolicy: Never
      serviceAccountName: sipbench-runner
      containers:
        - name: sipbench
          image: sipbench:dev
          imagePullPolicy: IfNotPresent
          args: ["run", "scenarios"]
          env:
            - {name: SIPBENCH_EDGE, value: "kamailio-sip:5060"}
            - {name: SIPBENCH_MOCK, value: "http://mockbackend:8080"}
            - {name: SIPBENCH_ESL, value: ""}             # set but empty: no event socket
            - {name: SIPBENCH_TARGET, value: "0.0.0.0:5090"}
            - {name: SIPBENCH_CAPS, value: "mock,codec:pcmu,codec:pcma,proxy,netem"}  # proxy: the edge address is Kamailio
            - {name: SIPBENCH_FLEET, value: "telephony/edge"}    # namespace/name; empty skips the fleet scenarios
            - {name: SIPBENCH_RUN, value: ""}             # a regexp picking scenarios by name; hack/kind.sh bench sets it
            - {name: SIPBENCH_JSON, value: ""}            # "-" prints the JSON report after the summary; hack/kind.sh bench sets it
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          ports:
            - {name: target-udp, containerPort: 5090, protocol: UDP}
