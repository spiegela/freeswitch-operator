# The bench: FreeSWITCH configured as the edge, the mock backend behind it, and the runner as the far end.
#
#   docker compose up -d --build                                  # edge + mock backend
#   docker compose run --rm --use-aliases sipbench run scenarios  # run every scenario
#   docker compose down
#
# --use-aliases matters: the edge places transfers to sipbench:5090, the runner's transfer target.
name: sipbench

services:
  freeswitch:
    # FreeSWITCH 1.10.10, multi-arch (native arm64 and amd64). Pinned by tag and digest.
    image: drachtio/drachtio-freeswitch-mrf:0.9.6@sha256:cb81acc1112990ca33693374f1de7443d44cf9c95e6ae6c02ba1edcee4b68bba
    # The image's entrypoint rewrites its own config; run the binary directly against ours.
    entrypoint: ["/usr/local/freeswitch/bin/freeswitch"]
    command: ["-nonat", "-nf", "-nc", "-conf", "/usr/local/freeswitch/conf", "-log", "/tmp", "-db", "/tmp"]
    volumes:
      - ./freeswitch/conf:/usr/local/freeswitch/conf:ro
      # On a cluster the operator projects the node's external address here (downward API); without it the
      # edge advertises its own address.
      # - ./podinfo:/etc/freeswitch-operator/podinfo:ro
    environment:
      BACKEND_HOST: mockbackend:5060
      TRANSFER_HOST: sipbench:5090
      UNREACHABLE_HOST: 192.0.2.1:5060
      RING_TIMEOUT: "6"
      FALLBACK_TONE_HZ: "1400"
      FALLBACK_TONE_MS: "3000"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/freeswitch/bin/fs_cli -x 'sofia status' | grep -q 'trunks.*RUNNING'"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      mockbackend:
        condition: service_healthy

  mockbackend:
    build: .
    image: ${SIPBENCH_IMAGE:-sipbench:dev}   # another tag keeps a second checkout's bench apart (with -p)
    entrypoint: ["mockbackend"]
    command: ["-config", "/bench/backends/mock.yaml", "-sip", "0.0.0.0:5060", "-http", "0.0.0.0:8080"]
    volumes:
      - ./backends:/bench/backends:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  sipbench:
    image: ${SIPBENCH_IMAGE:-sipbench:dev}
    profiles: ["bench"]
    # netem: the runner impairs its own traffic with tc (the netem scenarios), which needs NET_ADMIN.
    cap_add: [NET_ADMIN]
    environment:
      SIPBENCH_EDGE: freeswitch:5060
      SIPBENCH_MOCK: http://mockbackend:8080
      SIPBENCH_ESL: freeswitch:8021
      SIPBENCH_TARGET: 0.0.0.0:5090
      SIPBENCH_CAPS: mock,esl,codec:pcmu,codec:pcma,netem,sip-trace
    volumes:
      - ./scenarios:/bench/scenarios:ro
      - ./reports:/bench/reports
    depends_on:
      freeswitch:
        condition: service_healthy

  # The Go integration test (build tag "integration"), run from source inside the bench network. It answers
  # transfers as sipbench:5090 too, so don't run it alongside the sipbench service.
  integration:
    image: golang:1.26-alpine
    profiles: ["test"]
    working_dir: /src
    command: ["go", "test", "-tags", "integration", "-count=1", "-v", "-run", "TestScenarios", "./internal/runner/"]
    environment:
      CGO_ENABLED: "0"
      SIPBENCH_EDGE: freeswitch:5060
      SIPBENCH_MOCK: http://mockbackend:8080
      SIPBENCH_ESL: freeswitch:8021
      SIPBENCH_TARGET: 0.0.0.0:5090
    volumes:
      - .:/src
      - gocache:/go/pkg/mod
    networks:
      default:
        aliases: [sipbench]
    depends_on:
      freeswitch:
        condition: service_healthy

volumes:
  gocache:
