source:
  id: sipbench
  title: Cases written for this edge
  reference: ../scenarios
  citation: Our own cases; the IDs follow the scenario names.

cases:
  - id: sb-basic-two-way
    ref: basic-two-way
    title: Inbound call bridged to the backend with two-way audio
    area: call-setup
    component: edge
    expect: >
      A call from the far end is bridged to the backend; each side hears the other's tone; the caller's BYE ends
      both legs.
    status: covered
    scenarios: [basic-two-way]

  - id: sb-backend-hangup
    ref: backend-hangup
    title: Backend ends the call
    area: call-release
    component: edge
    expect: The backend's BYE reaches the far end and both legs end.
    status: covered
    scenarios: [backend-hangup]

  - id: sb-cancel
    ref: cancel
    title: Caller abandons while the backend rings
    area: call-release
    component: edge
    expect: The far end's CANCEL reaches the backend while it rings, and the INVITE ends with 487.
    status: covered
    scenarios: [cancel]

  - id: sb-busy-fallback
    ref: busy-fallback
    title: Backend busy (486) gets the fallback, not the failure
    area: error-handling
    component: edge
    expect: >
      The edge answers the caller with the fallback (in the bench a 1400 Hz tone and an X-Fallback-Reason header)
      instead of passing 486 back, then hangs up.
    status: covered
    scenarios: [busy-fallback]

  - id: sb-decline-fallback
    ref: decline-fallback
    title: Backend declines (603) gets the fallback
    area: error-handling
    component: edge
    expect: As for busy, on a 603.
    status: covered
    scenarios: [decline-fallback]

  - id: sb-no-answer-fallback
    ref: no-answer-fallback
    title: Backend rings past the ring timeout gets the fallback
    area: error-handling
    component: edge
    expect: After the edge's ring timeout the backend leg is cancelled and the caller gets the fallback.
    status: covered
    scenarios: [no-answer-fallback]

  - id: sb-unreachable-fallback
    ref: unreachable-fallback
    title: Backend unreachable gets the fallback
    area: error-handling
    component: edge
    expect: A backend address that never answers ends in the fallback once the ring timeout passes.
    status: covered
    scenarios: [unreachable-fallback]

  - id: sb-header-passthrough
    ref: header-passthrough
    title: X- headers reach the backend
    area: headers
    component: edge
    expect: X- headers from the far end arrive at the backend unchanged.
    status: covered
    scenarios: [header-passthrough]

  - id: sb-blind-transfer
    ref: blind-transfer
    title: Backend's blind transfer (REFER) is carried out by the edge
    area: transfer
    component: edge
    expect: >
      The edge accepts the REFER (202 and NOTIFY), releases the backend, and calls the target carrying the
      caller's X- headers; the caller hears the backend, then the target, and the target hears the caller.
    status: covered
    scenarios: [blind-transfer]

  - id: sb-dtmf-both-ways
    ref: dtmf-both-ways
    title: RFC 2833 DTMF in both directions
    area: dtmf
    component: edge
    expect: Telephone-events pass through the edge both ways with the same digits.
    status: covered
    scenarios: [dtmf-both-ways]

  - id: sb-codec-pcmu
    ref: codec-pcmu
    title: PCMU-only offer
    area: codec
    component: edge
    expect: A far end offering only PCMU gets PCMU end to end, with audio both ways.
    status: covered
    scenarios: [codec-pcmu]

  - id: sb-codec-pcma
    ref: codec-pcma
    title: PCMA-only offer
    area: codec
    component: edge
    expect: A far end offering only PCMA gets PCMA end to end, with audio both ways.
    status: covered
    scenarios: [codec-pcma]

  - id: sb-codec-g722
    ref: codec-g722
    title: G.722-only offer
    area: codec
    component: edge
    expect: A far end offering only G.722 gets G.722 end to end.
    status: partial
    scenarios: [codec-g722]
    gap: Skipped in every run so far; the bench image has no G.722 module and the runner no G.722 codec.

  - id: sb-admission-limit
    ref: admission-limit
    title: Calls beyond the session limit are refused with 503
    area: capacity
    component: freeswitch
    expect: With the limit at two bridged calls, a third is refused with 503 and never reaches the backend.
    status: partial
    scenarios: [admission-limit]
    gap: Runs only against a single FreeSWITCH with its event socket (compose); behind Kamailio it is skipped.

  - id: sb-options
    ref: options
    title: OPTIONS answered while there is capacity
    area: keepalive
    component: edge
    expect: OPTIONS to the edge get 200 (what a peer's or Kamailio's probing sends).
    status: covered
    scenarios: [options]

  - id: sb-echo
    ref: echo
    title: Media path round trip
    area: media
    component: edge
    expect: The backend echoes the caller's audio; the caller hears its own 600 Hz back through the edge.
    status: covered
    scenarios: [echo]

  - id: sb-drain-mid-call
    ref: drain-mid-call
    title: Node drained with a live call
    area: resilience
    component: operator
    expect: >
      A draining node leaves dispatch at once, new calls go elsewhere, its live call continues with audio until
      it ends, and only then does the node stop.
    status: covered
    scenarios: [drain-mid-call]

  - id: sb-rolling-update-live-call
    ref: rolling-update-live-call
    title: Rolling update with a live call
    area: resilience
    component: operator
    expect: >
      The roll replaces one node at a time and waits for the node carrying the call to drain; the call keeps
      two-way audio throughout.
    status: covered
    scenarios: [rolling-update-live-call]

  - id: sb-bad-config-stops-roll
    ref: bad-config-stops-roll
    title: A config without a SIP profile on the SIP port stops the roll at one node
    area: resilience
    component: operator
    expect: >
      The first replaced node never passes its startup probe, the roll stops there, the other nodes keep serving,
      and restoring the config lets the roll finish.
    status: covered
    scenarios: [bad-config-stops-roll]

  - id: sb-pool-media-address
    ref: pool-media-address
    title: The edge advertises its pod's external address for media
    area: media
    component: operator
    expect: >
      The answer's SDP connection address is the external address the operator recorded on one of the fleet's pods
      (its SIPAddressPool's binding), and audio sent there arrives: each side hears the other's tone.
    status: covered
    scenarios: [pool-media-address]

  - id: sb-node-lost-mid-call
    ref: node-lost-mid-call
    title: A node that goes dark mid-call doesn't take new calls down with it
    area: resilience
    component: operator
    expect: >
      With one node off the network (no packet in or out), the rest of the fleet keeps taking calls: a call placed
      as the node goes dark is set up within Kamailio's 5 s failover, one placed after the dispatcher's probes
      have taken the node out has no failover delay, neither lands on the dark node, and once it is back the fleet
      is whole. What happens to the dark node's own call is imp-node-lost-mid-call-recovery (M4); this scenario
      records it without checking it.
    status: covered
    scenarios: [node-lost-mid-call]

  - id: sb-crash-recovers-own-calls
    ref: crash-recovers-own-calls
    title: A node's FreeSWITCH crashes mid-call and recovers its own calls, and no other node's
    area: resilience
    component: freeswitch
    expect: >
      After FreeSWITCH crashes and restarts on the same node, `sofia recover` there takes exactly the legs of that
      node's calls from the shared recovery table, not the other nodes', since each node's profiles are named for
      its address. Every call is still up at the end with audio both ways: the recovered ones after a gap of the
      restart's length, the others undisturbed.
    status: covered
    scenarios: [crash-recovers-own-calls]

  - id: sb-moved-call-in-dialog
    ref: moved-call-in-dialog
    title: A call's FreeSWITCH moves to a spare node mid-call, and the call's SIP follows it both ways
    area: resilience
    component: freeswitch
    expect: >
      After a call's pod is moved to a spare edge node (its FreeSWITCH crashed, the pod deleted at once, the
      replacement on the spare with the same address), `sofia recover` there takes exactly that node's calls, and
      their re-INVITEs move both far ends to the spare. A BYE from the caller (through Kamailio) and one from the
      backend (directly) each reach the spare, which ends the other leg. The other node's calls run on without a
      gap.
    status: covered
    scenarios: [moved-call-in-dialog]

  - id: sb-barge-in-vad-mode
    ref: barge-in-vad-mode
    title: Barge-in detection is switchable per call between the edge and the agent
    area: media
    component: freeswitch
    expect: >
      Without an X-Barge-In-VAD header the fleet's mode applies and the backend is told it; a caller's
      X-Barge-In-VAD: freeswitch turns on the edge's echo cancellation and voice detectors for that call and tells the
      backend so, with audio unaffected both ways; any other value is ignored. With the edge detecting, each start
      and stop of speech reaches the backend as a SIP INFO naming whose speech it was, the caller's or the agent's,
      and each detector hears only its own side; with the agent detecting the edge sends none.
    status: covered
    scenarios: [barge-in-vad-mode]

  - id: sb-barge-in-livekit
    ref: barge-in-livekit
    title: The edge's barge-in detections reach a LiveKit agent's room
    area: media
    component: freeswitch
    expect: >
      A call to an "lk" number reaches LiveKit SIP and joins the agent's room, its X-Barge-In-VAD mode visible to the
      agent as a participant attribute. With the edge detecting, each start and stop of the caller's speech reaches
      the room as a data packet on the topic barge-in (the edge's SIP INFO, forwarded by our patched LiveKit SIP),
      and no agent detections come while the agent is silent; with the agent detecting, none come.
    status: covered
    scenarios: [barge-in-livekit]

  - id: sb-silent-node-stays-in-rotation
    ref: silent-node-stays-in-rotation
    title: A request every node discards doesn't take the nodes out of rotation
    area: resilience
    component: proxy
    expect: >
      When every node discards a request without answering, the caller gets 408 and the nodes stay in rotation: the
      next call goes through. Only a 503, or failed probes, take a node out; otherwise one such request would empty
      the fleet. Kamailio counts it in kamailio_silent_drops_total{cause="request"}.
    status: planned
    milestone: M2b
    gap: >
      Kamailio now refuses the one request found that every node discarded (a malformed From display name), and no
      other found does the same, so nothing reaches this path from outside. Needs a stand-in node that stays silent on
      a marked request. Checked by hand when the change went in (both outcomes, and both causes counted).
