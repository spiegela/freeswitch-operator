name: netem-media-loss
area: impairment
description: >
  5% independent loss on the caller's media, each direction. Each side still hears the other's tone in at least
  90% of its frames, and the loss the caller measures by RTP sequence number matches what was injected. The
  edge relays what arrives (it neither stops nor restarts the stream).
requires: [mock, netem]
timeoutMs: 90000
impairments:
  - {link: carrier-edge, direction: both, traffic: rtp, loss: 5%}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 30000}
      - hangup: {}
    maxDurationMs: 40000
    expect:
      status: 200
      tonesHeard: [1000]
      minToneCoverage: 0.9
      # 1500 packets at 5%: a standard deviation is about 0.6 points.
      rtpLossPct: {min: 3, max: 7}
      endedBy: local
      backend: {answered: true, tonesHeard: [600], endedBy: remote}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 60000}
