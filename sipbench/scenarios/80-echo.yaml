name: echo
area: basic
description: The backend echoes the caller's audio; the caller hears its own 600 Hz back through the edge.
requires: [mock]
calls:
  - id: a
    to: echo
    steps:
      - tone: {hz: 600, ms: 2500}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [600]
      backend: {tonesHeard: [600]}
