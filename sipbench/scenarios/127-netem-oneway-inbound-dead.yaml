name: netem-oneway-inbound-dead
area: impairment
long: true
description: >
  The caller's media never reaches the edge. Signalling completes and the caller hears the backend, but the
  backend never hears the caller. The edge notices no RTP arriving and ends the call on its media timeout
  (60 s): a BYE to the caller and the backend leg released, about a minute after answer.
requires: [mock, netem]
timeoutMs: 120000
impairments:
  - {link: carrier-edge, direction: to-edge, traffic: rtp, loss: 100%}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 90000}
    maxDurationMs: 90000
    expect:
      status: 200
      tonesHeard: [1000]
      endedBy: remote
      durationMs: {min: 58000, max: 63000}
      backend: {answered: true, tonesNotHeard: [600], endedBy: remote}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 100000}
