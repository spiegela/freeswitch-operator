name: netem-sig-loss-random
area: impairment
long: true
description: >
  5% random loss on the caller's signalling, each direction, over 50 calls. Every call is answered and ends
  cleanly with one leg at the backend; retransmissions recover the losses, so setup time p95 stays within about
  two lost copies (1.5 s) of a clean call's.
requires: [mock, netem, sip-trace]
timeoutMs: 120000
impairments:
  - {link: carrier-edge, direction: both, traffic: sip, loss: 5%}
calls:
  - id: a
    to: agent
    repeat: {count: 50, everyMs: 500, setupP95Ms: 1700}
    steps:
      - tone: {hz: 600, ms: 1500}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      endedBy: local
      sip:
        - {in: 200 INVITE, min: 1, oneToTag: true}
      backend: {calls: 1, answered: true, endedBy: remote}
