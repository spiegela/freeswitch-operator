name: netem-media-baseline
area: impairment
description: >
  What the edge itself adds on a clean network, with the bench's tc machinery in place but impairing nothing:
  no RTP loss toward the caller, tones arriving whole both ways, and the echo round trip (caller to backend and
  back through the edge twice) short. The impaired scenarios compare against these figures.
requires: [mock, netem]
impairments:
  - {link: carrier-edge, direction: both, traffic: rtp, loss: 0%}
calls:
  - id: tone
    to: throughout
    steps:
      - tone: {hz: 600, ms: 8000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      minToneCoverage: 0.98
      maxAudioGapMs: 100
      rtpLossPct: {max: 0}
      backend: {answered: true, tonesHeard: [600], maxAudioGapMs: 100}
  - id: echo
    to: echo
    steps:
      - wait: {ms: 1000}
      - tone: {hz: 600, ms: 4000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [600]
      minToneCoverage: 0.98
      echoMs: {max: 120}
      rtpLossPct: {max: 0}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 20000}
