name: backend-hangup
area: basic
description: The backend ends the call; the BYE reaches the far end.
requires: [mock]
calls:
  - id: a
    to: hangup
    steps:
      - tone: {hz: 600, ms: 1500}
    maxDurationMs: 10000
    expect:
      status: 200
      tonesHeard: [1000]
      endedBy: remote
      backend:
        tonesHeard: [600]
        endedBy: local
