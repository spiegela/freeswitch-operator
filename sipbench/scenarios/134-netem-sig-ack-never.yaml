name: netem-sig-ack-never
area: impairment
description: >
  No ACK ever reaches the edge. It resends its 200 (the gaps doubling up to T2), gives up 64*T1 after the first,
  and ends the call: a BYE toward the caller, and the backend leg released.
requires: [mock, sip-trace]
timeoutMs: 90000
impairments:
  - {link: carrier-edge, direction: to-edge, traffic: sip, drop: every ACK}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 60000}
    maxDurationMs: 60000
    expect:
      status: 200
      endedBy: remote
      sip:
        # 0, 0.5, 1.5, 3.5, 7.5 s, then every 4 s up to 32 s: 11 copies.
        - {in: 200 INVITE, min: 9, oneToTag: true}
        - {in: BYE, min: 1, firstMs: {min: 31500, max: 35000}}
      backend: {calls: 1, answered: true, endedBy: remote}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 60000}
