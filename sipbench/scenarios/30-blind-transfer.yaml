name: blind-transfer
area: transfers
description: >
  The backend asks for a blind transfer with a REFER. The edge ends the REFER itself (202, NOTIFY, releases
  the backend) and places the transfer to the runner's target, carrying the caller's X- headers. The caller
  hears the backend, then the target; the target hears the caller.
requires: [mock]
calls:
  - id: a
    to: transfer
    headers:
      X-Conversation-Id: 2b9e4c71-0d3f-4a8e-b5c6-9f1e7a2d4c80
    steps:
      - tone: {hz: 600, ms: 7000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000, 1800]
      endedBy: local
      backend:
        referAccepted: true
        endedBy: remote
      target:
        answered: true
        tonesHeard: [600]
        headers: {X-Conversation-Id: 2b9e4c71-0d3f-4a8e-b5c6-9f1e7a2d4c80}
        endedBy: remote
