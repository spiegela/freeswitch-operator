name: netem-sig-bye-lost-in
area: impairment
description: >
  The caller's BYE is lost once on the way in. Its retransmission half a second later ends the call: the edge
  answers it 200 within a second of the first copy, and releases the backend leg.
requires: [mock, sip-trace]
impairments:
  - {link: carrier-edge, direction: to-edge, traffic: sip, drop: first BYE}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 2000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      endedBy: local
      sip:
        - {out: BYE, min: 2, max: 2, deliveredWithinMs: 700}
        - {in: 200 BYE, min: 1}
      backend: {calls: 1, answered: true, endedBy: remote}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 20000}
