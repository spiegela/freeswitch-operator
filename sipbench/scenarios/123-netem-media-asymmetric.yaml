name: netem-media-asymmetric
area: impairment
description: >
  10% loss on the caller's media toward the edge only. Directions stay independent: the backend still hears the
  caller, the caller measures no loss on what the edge sends it, and the edge neither ends nor renegotiates the
  call. A second call, echoed by the backend, shows the loss coming back: the caller hears its own tone with
  frames missing.
requires: [mock, netem]
timeoutMs: 60000
impairments:
  - {link: carrier-edge, direction: to-edge, traffic: rtp, loss: 10%}
calls:
  - id: tone
    to: throughout
    steps:
      - tone: {hz: 600, ms: 15000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      minToneCoverage: 0.98
      rtpLossPct: {max: 0.5}
      endedBy: local
      backend: {answered: true, tonesHeard: [600], endedBy: remote}
  - id: echo
    to: echo
    steps:
      - wait: {ms: 500}
      - tone: {hz: 600, ms: 6000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [600]
      minToneCoverage: 0.75
      endedBy: local
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 30000}
