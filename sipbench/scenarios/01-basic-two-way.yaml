name: basic-two-way
area: basic
description: >
  The far end calls in, the edge bridges to the backend, and audio flows both ways: the backend hears the
  caller's 600 Hz and the caller hears the backend's 1000 Hz. The caller hangs up.
requires: [mock]
calls:
  - id: a
    to: agent
    steps:
      - tone: {hz: 600, ms: 2500}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      tonesNotHeard: [1400]
      endedBy: local
      backend:
        answered: true
        tonesHeard: [600]
        endedBy: remote
