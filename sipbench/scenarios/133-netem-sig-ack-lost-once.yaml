name: netem-sig-ack-lost-once
area: impairment
description: >
  The caller's ACK is lost once. The edge resends its 200, the caller ACKs the copy, the edge stops resending,
  and the call goes on with audio both ways: no BYE from the edge, one leg at the backend.
requires: [mock, sip-trace]
impairments:
  - {link: carrier-edge, direction: to-edge, traffic: sip, drop: first ACK}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 6000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      maxAudioGapMs: 500
      endedBy: local
      sip:
        # 200 at 0, resent at 0.5 s and ACKed; at most one more copy can be in flight.
        - {in: 200 INVITE, min: 2, max: 3, oneToTag: true}
        - {out: ACK, min: 2}
        - {in: BYE, max: 0}
      backend: {calls: 1, answered: true, tonesHeard: [600], endedBy: remote}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 20000}
