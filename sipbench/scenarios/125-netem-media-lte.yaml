name: netem-media-lte
area: impairment
description: >
  A typical mobile caller's path, each direction: 40 ms delay, 3 ms jitter, 1% loss in runs of about 2 packets
  (Gilbert-Elliott). Tones are heard both ways with at least 95% of their frames, and the caller measures loss
  near the injected rate.
requires: [mock, netem]
timeoutMs: 60000
impairments:
  - {link: carrier-edge, direction: both, traffic: rtp, delay: 40ms, jitter: 3ms, loss: 1%, burst: 2}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 30000}
      - hangup: {}
    maxDurationMs: 40000
    expect:
      status: 200
      tonesHeard: [1000]
      minToneCoverage: 0.95
      # 1500 packets in runs of 2: about 7 runs, so the measured rate swings widely.
      rtpLossPct: {max: 3}
      endedBy: local
      backend: {answered: true, tonesHeard: [600], endedBy: remote}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 60000}
