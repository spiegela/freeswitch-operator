name: rolling-update-live-call
area: fleet
description: >
  A rolling update with a live call. With a call up, the runner changes the fleet's pod template, so the operator
  replaces the pods one at a time. When it reaches the pod carrying the call, that pod drains instead of dropping
  the call: the call keeps audio both ways throughout, and once the caller hangs up the roll finishes.
requires: [mock, fleet]
timeoutMs: 900000
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 600000}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 600000}
    maxDurationMs: 610000
    expect:
      status: 200
      tonesHeard: [1000]
      maxAudioGapMs: 500
      endedBy: local
      backend:
        answered: true
        tonesHeard: [600]
        maxAudioGapMs: 500
        endedBy: remote
actions:
  - afterAnswered: a
    afterMs: 3000
    rollFleet: {}
  # Wherever the call's pod falls in the order, the roll reaches it while the call is up.
  - waitMember: {of: a, state: Draining, timeoutMs: 400000}
  - afterMs: 10000
    hangup: a
  - waitFleetCurrent: {timeoutMs: 400000}
