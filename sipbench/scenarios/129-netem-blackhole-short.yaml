name: netem-blackhole-short
area: impairment
description: >
  Everything between the caller and the edge is cut for 2 s, 5 s into the call. The call survives: no BYE
  either way, and audio is back both ways within half a second of the link returning (no tone goes missing much
  longer than the cut).
requires: [mock, netem, sip-trace]
timeoutMs: 60000
impairments:
  - {link: carrier-edge, direction: both, traffic: all, loss: 100%, at: 5s, for: 2s}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 15000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      maxAudioGapMs: 2500
      endedBy: local
      sip:
        - {in: BYE, max: 0}
      backend: {answered: true, tonesHeard: [600], maxAudioGapMs: 2500, endedBy: remote}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 30000}
