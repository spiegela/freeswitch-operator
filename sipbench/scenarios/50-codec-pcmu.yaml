name: codec-pcmu
area: codecs
description: A far end offering only PCMU gets PCMU end to end.
requires: [mock, codec:pcmu]
calls:
  - id: a
    to: agent
    codecs: [pcmu]
    steps:
      - tone: {hz: 600, ms: 1500}
      - hangup: {}
    expect:
      status: 200
      codec: PCMU
      tonesHeard: [1000]
      backend: {codec: PCMU, tonesHeard: [600]}
