name: netem-sig-200-lost
area: impairment
description: >
  The edge's 200 to the INVITE is lost on the way out. The edge resends it until the caller's ACK arrives: the
  caller gets it within 1.5 s of the first copy, every copy has the same To tag, and the call is up with audio
  both ways until the caller hangs up (the edge does not give up for want of an ACK).
requires: [mock, sip-trace]
impairments:
  - {link: carrier-edge, direction: from-edge, traffic: sip, drop: first 200 to INVITE}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 6000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      maxAudioGapMs: 500
      endedBy: local
      sip:
        - {in: 200 INVITE, min: 2, max: 3, deliveredWithinMs: 1500, oneToTag: true}
        - {in: BYE, max: 0}
      backend: {calls: 1, answered: true, tonesHeard: [600], endedBy: remote}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 20000}
