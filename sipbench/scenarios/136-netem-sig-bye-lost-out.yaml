name: netem-sig-bye-lost-out
area: impairment
description: >
  The backend hangs up, and the edge's BYE toward the caller is lost once. The edge resends it and stops once the
  caller's 200 arrives. RFC 3261 resends at T1 (500 ms); FreeSWITCH 1.10.10 was measured resending after about
  1 s, so the bound here is 1.5 s (see imp-sig-bye-lost-out in the conformance record).
requires: [mock, sip-trace]
impairments:
  - {link: carrier-edge, direction: from-edge, traffic: sip, drop: first BYE}
calls:
  - id: a
    to: hangup
    steps:
      - tone: {hz: 600, ms: 10000}
    maxDurationMs: 10000
    expect:
      status: 200
      tonesHeard: [1000]
      endedBy: remote
      sip:
        - {in: BYE, min: 2, max: 2, deliveredWithinMs: 1500}
        - {out: 200 BYE, min: 1, max: 1}
      backend: {calls: 1, answered: true, endedBy: local}
