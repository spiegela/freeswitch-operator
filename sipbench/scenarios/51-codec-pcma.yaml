name: codec-pcma
area: codecs
description: A far end offering only PCMA gets PCMA end to end.
requires: [mock, codec:pcma]
calls:
  - id: a
    to: agent
    codecs: [pcma]
    steps:
      - tone: {hz: 600, ms: 1500}
      - hangup: {}
    expect:
      status: 200
      codec: PCMA
      tonesHeard: [1000]
      backend: {codec: PCMA, tonesHeard: [600]}
