name: drain-mid-call
area: fleet
description: >
  A node drained mid-call keeps its call. With a call up, the runner drains the call's edge node as kubectl drain
  would (cordon, then evict the FreeSWITCH pod), so the pod's preStop drain starts. The pod leaves dispatch at
  once: a call placed meanwhile lands on another node. The drained call keeps audio both ways until the caller
  hangs up, which lets the pod finish draining; the node is uncordoned and the fleet comes back whole.
requires: [mock, fleet]
timeoutMs: 600000
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 120000}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 120000}
    maxDurationMs: 130000
    expect:
      status: 200
      tonesHeard: [1000]
      maxAudioGapMs: 500
      endedBy: local
      backend:
        answered: true
        tonesHeard: [600]
        maxAudioGapMs: 500
        endedBy: remote
  - id: b
    to: agent
    startAfter: draining
    startMs: 2000
    steps:
      - tone: {hz: 600, ms: 1500}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      backend:
        answered: true
        tonesHeard: [600]
        otherNodeThan: a
actions:
  - afterAnswered: a
    afterMs: 3000
    drainNodeOf: a
  - name: draining
    waitMember: {of: a, state: Draining, timeoutMs: 30000}
  # The call holds on the draining pod while call b goes elsewhere, then ends.
  - afterMs: 15000
    hangup: a
  - afterEnded: a
    uncordon: {}
  - waitFleetCurrent: {timeoutMs: 300000}
