name: pool-media-address
area: addresses
description: >
  The edge advertises the address its pod was given for media. The far end calls in; the edge's answer must name,
  as its SDP connection address, the external address the operator recorded on one of the fleet's pods (on AWS,
  the Elastic IP its SIPAddressPool bound). Tones both ways show media sent to that address arrives.
requires: [fleet, mock, address-pool]   # address-pool: the fleet draws from a SIPAddressPool
calls:
  - id: a
    to: agent
    steps:
      - tone: {hz: 600, ms: 2500}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      tonesNotHeard: [1400]
      endedBy: local
      mediaAddress: fleet
      backend:
        answered: true
        tonesHeard: [600]
        endedBy: remote
