name: node-lost-mid-call
area: fleet
long: true
description: >
  An edge node goes dark mid-call. Ten seconds into a call the runner takes the call's node off the network for
  two minutes (no packet in or out, ARP included, as if it had lost power), longer than FreeSWITCH's media
  timeout and long enough for Kubernetes to mark the node NotReady. The rest of the fleet keeps taking calls: one
  placed as the node goes dark is set up within Kamailio's 5 s failover, and one placed 30 s later, once the
  dispatcher's probes have taken the node out, without any. The operator finds the member Failed (its node lost
  and its SIP unanswered), fences the node and starts the pod on the spare edge node, with the member's address.
  There FreeSWITCH recovers the call on start (spec.recovery), before the pod turns ready and while the node is
  still dark: the recovery must take exactly the call's two legs, and the call must have audio both ways again,
  through to the runner's hangup, whose BYE must reach the backend through the spare. When the node comes back the
  runner unfences it. Needs call tracking and recovery on start, and a spare edge node holding no address of its
  own, as on kind.
requires: [mock, fleet, node-blackout, spare-node, call-recovery]
timeoutMs: 600000
metrics:
  - {query: 'sum(freeswitch_operator_failovers_total{result="ok"})', increase: 1}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 240000}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 240000}
    maxDurationMs: 250000
    expect:
      status: 200
      tonesHeard: [1000]
      # Silent from the node going dark until the call is recovered on the spare: NotReady (up to 50 s on kind),
      # failAfterSeconds (15 s), the pod's start there and the wait for its profiles: 70 s on kind. A call whose audio
      # never came back would be silent on to its hangup, 45 s after the recovery.
      maxAudioGapMs: 100000
      endedBy: local
      backend:
        answered: true
        tonesHeard: [600]
        maxAudioGapMs: 100000
        endedBy: remote
  # Placed as the node goes dark: Kamailio may still pick it, and must fail over within 5 s.
  - id: b
    to: agent
    startAfter: dark
    steps:
      - tone: {hz: 600, ms: 1500}
      - hangup: {}
    expect:
      status: 200
      maxSetupMs: 7000
      tonesHeard: [1000]
      backend:
        answered: true
        tonesHeard: [600]
        otherNodeThan: a
  # Placed once the dispatcher's probes have taken the node out (two missed: a probe every 10 s, each failing after
  # 5 s, so 15 to 25 s), and before Kubernetes marks the node NotReady (about 50 s on kind), so the probes alone
  # are tested: no failover delay. The operator's dispatcher reloads in between must keep the node out.
  - id: c
    to: agent
    startAfter: dark
    startMs: 30000
    steps:
      - tone: {hz: 600, ms: 1500}
      - hangup: {}
    expect:
      status: 200
      maxSetupMs: 1500
      tonesHeard: [1000]
      backend:
        answered: true
        tonesHeard: [600]
        otherNodeThan: a
actions:
  - name: dark
    afterAnswered: a
    afterMs: 10000
    blackoutNodeOf: {of: a, forMs: 120000}
  - waitNode: {of: a, state: NotReady, timeoutMs: 120000}
  # NotReady takes the node lifecycle controller up to 50 s; then failAfterSeconds (15 s), then a pod start on the
  # spare. All within the two minutes the node is dark.
  - waitFailover: {of: a, timeoutMs: 110000}
  - expectRecovered: a
  # Long enough after recovery for audio both ways to show, well inside the media timeout (60 s).
  - afterMs: 45000
    hangup: a
  - waitNode: {of: a, state: Ready, timeoutMs: 240000}
  - waitFleetCurrent: {timeoutMs: 300000}
