name: netem-oneway-outbound-dead
area: impairment
description: >
  The edge's media never reaches the caller. The caller hears nothing, the backend hears the caller. The edge
  still receives media, so it must not time the call out: the call outlasts the 60 s media timeout and ends
  when the caller hangs up, both legs then.
requires: [mock, netem]
timeoutMs: 120000
impairments:
  - {link: carrier-edge, direction: from-edge, traffic: rtp, loss: 100%}
calls:
  - id: a
    to: throughout
    steps:
      - tone: {hz: 600, ms: 70000}
      - hangup: {}
    maxDurationMs: 90000
    expect:
      status: 200
      tonesNotHeard: [1000]
      endedBy: local
      durationMs: {min: 69000}
      backend: {answered: true, tonesHeard: [600], endedBy: remote}
backend:
  routes:
    throughout:
      steps:
        - answer: {}
        - tone: {hz: 1000, ms: 100000}
