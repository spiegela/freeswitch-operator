name: netem-sig-delay-over-t1
area: impairment
description: >
  400 ms each way on the caller's signalling: an 800 ms round trip, longer than T1, so the caller resends its
  INVITE and the edge its 200 before anything is lost. Every copy is absorbed: one leg per call at the backend,
  no second dialog, and setup within 2.5 round trips plus 200 ms.
requires: [mock, netem, sip-trace]
timeoutMs: 90000
impairments:
  - {link: carrier-edge, direction: both, traffic: sip, delay: 400ms}
calls:
  - id: a
    to: agent
    repeat: {count: 10, everyMs: 1000}
    steps:
      - tone: {hz: 600, ms: 1500}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      maxSetupMs: 2200
      endedBy: local
      sip:
        - {out: INVITE, min: 2}
        - {in: 200 INVITE, min: 1, oneToTag: true}
        - {in: 482 INVITE, max: 0}
      backend: {calls: 1, answered: true, endedBy: remote}
