name: raw-large-messages
area: proxy-validation
description: >
  Message size and stream framing. An INVITE of about 60 KB over UDP (close to the most a UDP datagram carries) and
  one of about 64 KB over TCP, each with a large SDP body, are relayed and the calls complete; so is an INVITE sent
  over TCP after blank lines, which a stream may carry between messages. Kamailio needs its receive limits raised
  for this (msg_recv_max_size and tcp_rd_buf_size): by default it drops a datagram over 32 KB unread and overruns
  its TCP read buffer well short of 64 KB.
requires: [proxy, mock]
raw:
  - id: large-udp
    waitMs: 5000
    message: |
      INVITE sip:agent@{{edge}} SIP/2.0
      Via: SIP/2.0/{{transport}} {{local}};branch={{branch}}
      Max-Forwards: 70
      From: <sip:sipbench@{{localHost}}>;tag={{tag}}
      To: <sip:agent@{{edge}}>
      Call-ID: {{callId}}
      CSeq: 1 INVITE
      Contact: <sip:sipbench@{{local}}>
      X-Sipbench-Call: {{bench}}
      Content-Type: application/sdp
      Content-Length: {{len}}

      v=0
      o=sipbench 1 1 IN IP4 {{localHost}}
      s=-
      c=IN IP4 {{localHost}}
      t=0 0
      m=audio 40000 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      a=x-sipbench-pad0:{{pad:1000}}
      a=x-sipbench-pad1:{{pad:1000}}
