name: netem-sig-invite-lost
area: impairment
description: >
  The caller's first INVITE is lost on the way in. Its retransmission half a second later starts the call as if
  nothing happened: one leg at the backend, a 200 to the caller, and setup no more than about T1 longer.
requires: [mock, sip-trace]
impairments:
  - {link: carrier-edge, direction: to-edge, traffic: sip, drop: first INVITE}
calls:
  - id: a
    to: agent
    steps:
      - tone: {hz: 600, ms: 1500}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [1000]
      maxSetupMs: 1200
      sip:
        - {out: INVITE, min: 2, deliveredWithinMs: 700}
        - {in: 200 INVITE, min: 1, oneToTag: true}
      backend: {calls: 1, answered: true, tonesHeard: [600]}
