name: netem-media-delay
area: impairment
description: >
  400 ms one way on the caller's media, each direction. Audio flows both ways, the call is not ended for
  lateness, and the echo round trip measures twice the delay plus the clean baseline.
requires: [mock, netem]
impairments:
  - {link: carrier-edge, direction: both, traffic: rtp, delay: 400ms}
calls:
  - id: echo
    to: echo
    steps:
      - wait: {ms: 1000}
      - tone: {hz: 600, ms: 4000}
      - wait: {ms: 1000}
      - hangup: {}
    expect:
      status: 200
      tonesHeard: [600]
      # Delay loses nothing, but the edge's jitter buffer may drop a few frames settling on it: 0.96 seen on kind.
      minToneCoverage: 0.95
      # 2 x 400 ms, plus the baseline (under 120 ms).
      echoMs: {min: 800, max: 920}
      endedBy: local
      backend: {answered: true, tonesHeard: [600], endedBy: remote}
