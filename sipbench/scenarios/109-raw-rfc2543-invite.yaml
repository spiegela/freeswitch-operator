name: raw-rfc2543-invite
area: proxy-validation
description: >
  An INVITE in the style of RFC 2543, SIP's first version: no branch in Via, no tag in From, no Max-Forwards and
  no Content-Length (the body runs to the end of the datagram). Kamailio accepts and relays it, and the call
  completes and is hung up.
requires: [proxy, mock]
raw:
  - id: invite
    message: |
      INVITE sip:agent@{{edge}} SIP/2.0
      Via: SIP/2.0/UDP {{local}}
      From: <sip:sipbench@{{localHost}}>
      To: <sip:agent@{{edge}}>
      Call-ID: {{callId}}
      CSeq: 1 INVITE
      Contact: <sip:sipbench@{{local}}>
      X-Sipbench-Call: {{bench}}
      Content-Type: application/sdp

      v=0
      o=sipbench 1 1 IN IP4 {{localHost}}
      s=-
      c=IN IP4 {{localHost}}
      t=0 0
      m=audio 40000 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
    expect:
      status: 200
      backend: {answered: true}
