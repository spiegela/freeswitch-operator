# The operator: CRDs, RBAC and manager from a tag of this repository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: freeswitch-operator
  namespace: flux-system
spec:
  interval: 10m
  url: ssh://git@git.example.com/sip/freeswitch-operator.git
  secretRef:
    name: freeswitch-operator-deploy-key
  ref:
    tag: v0.1.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: freeswitch-operator
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: freeswitch-operator
  path: ./config/default
  prune: true
  wait: true
  images:
    - name: controller
      newName: registry.example.com/sip/freeswitch-operator
      newTag: v0.1.0
