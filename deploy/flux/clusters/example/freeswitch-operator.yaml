# The operator: CRDs, RBAC and manager from a tag of this repository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: freeswitch-operator
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/spiegela/freeswitch-operator.git
  ref:
    tag: v0.1.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: freeswitch-operator
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: freeswitch-operator
  path: ./config/default
  prune: true
  wait: true
  images:
    - name: controller
      newName: ghcr.io/spiegela/freeswitch-operator   # published by .github/workflows/publish.yml
      newTag: "0.1.0"                               # the image tag drops the git tag's "v"
