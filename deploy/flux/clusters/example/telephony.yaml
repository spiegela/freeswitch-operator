# The SIP edge for this cluster, applied once the operator is ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: telephony
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: freeswitch-operator
  sourceRef:
    kind: GitRepository
    name: flux-system   # the fleet repository itself
  path: ./apps/telephony
  prune: true
  healthChecks:
    - apiVersion: sip.instruments.com/v1alpha1
      kind: FreeswitchCluster
      name: edge
      namespace: telephony
