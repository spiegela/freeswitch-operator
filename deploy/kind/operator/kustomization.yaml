# The operator as built locally and loaded into kind (hack/kind.sh), the same way the Flux example overrides the
# image of config/default.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../config/default
images:
  - name: controller
    newName: freeswitch-operator
    newTag: dev
patches:
  - target: {kind: Deployment, name: controller-manager}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
