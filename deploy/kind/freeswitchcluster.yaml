# Two FreeSWITCH nodes running sipbench's edge configuration, behind the KamailioCluster "proxy". kind has three
# edge nodes: the third is the spare a lost node's pod moves to (sipbench's moved-call-in-dialog).
apiVersion: sip.instruments.com/v1alpha1
kind: FreeswitchCluster
metadata:
  name: edge
spec:
  replicas: 2
  # images/freeswitch (FreeSWITCH 1.11.4, the project's own build), built and loaded into kind by hack/kind.sh.
  image: freeswitch:dev
  imagePullPolicy: IfNotPresent
  # The image's entrypoint rewrites its own config; run the binary against the assembled one instead.
  command: ["/usr/local/freeswitch/bin/freeswitch"]
  args: ["-nonat", "-nf", "-nc", "-conf", "/usr/local/freeswitch/conf", "-log", "/tmp", "-db", "/tmp"]
  env:
    - {name: BACKEND_HOST, value: "mockbackend.telephony.svc.cluster.local:5060"}
    # "lk<number>" goes here (hack/kind.sh livekit deploys it); without LiveKit those calls fail, and only the
    # livekit scenarios, skipped then, make them.
    - {name: LIVEKIT_HOST, value: "livekit-sip.livekit.svc.cluster.local:5060"}
    - {name: TRANSFER_HOST, value: "sipbench.telephony.svc.cluster.local:5090"}
    - {name: ESL_LISTEN_IP, value: "127.0.0.1"}
    # The core db and call tracking in the shared PostgreSQL (deploy/kind/postgres), so another node can recover a
    # lost node's calls. libpq reads the password from PGPASSWORD.
    - {name: CORE_DB_DSN, value: "pgsql://host=postgres.telephony.svc.cluster.local dbname=freeswitch user=freeswitch connect_timeout=5"}
    - name: PGPASSWORD
      valueFrom: {secretKeyRef: {name: postgres, key: password}}
    - {name: TRACK_CALLS, value: "true"}
  nodeSelector:
    node-role.example.com/sip-edge: "true"
  tolerations:
    - {key: node-role.example.com/sip-edge, operator: Exists, effect: NoSchedule}
  sip:
    port: 5060
  rtp:
    # Must match switch.conf.xml.
    portRangeStart: 16384
    portRangeEnd: 16784
  externalAddress:
    # An address MetalLB announces on kind's Docker network (hack/kind.sh makes the pool): FreeSWITCH binds RTP to
    # it and advertises it (bin/podinfo.sh). SIP stays on the node's own address,
    # where Kamailio dispatches to it.
    source: AddressPool
    addressPoolRef: {name: edge-media}
  config:
    mountPath: /usr/local/freeswitch/conf
    configMapRefs:
      - {name: freeswitch-conf, path: "."}
      - {name: freeswitch-autoload, path: autoload_configs}
      - {name: freeswitch-dialplan, path: dialplan}
      - {name: freeswitch-profiles, path: sip_profiles}
      - {name: freeswitch-bin, path: bin}
  # Each start of FreeSWITCH (a crash restarted, a pod replaced elsewhere with the same pool address) takes back the
  # calls tracked under its address before the pod turns ready. The profiles are named for it (bin/profile-name.sh).
  recovery: {}
  drain:
    # Short, so a stuck drain shows up quickly here. Production allows hours.
    maxDrainSeconds: 300
  metrics:
    # Built from this tree and loaded into kind (hack/kind.sh); in production, pin a published image by digest.
    exporterImage: freeswitch-exporter:dev
    exporterImagePullPolicy: Never
  failover:
    # The third edge node is the spare a Failed member's pod moves to (sipbench's node-lost-mid-call takes a
    # member's node dark and waits for it).
    mode: Automatic
  dispatcher:
    setID: 1
    configMapName: edge-dispatcher
    transport: udp
    # No jsonrpcURL: the KamailioCluster reads this list and drives its own pods.
