# The edge on kind: a KamailioCluster on the proxy nodes, a FreeswitchCluster with sipbench's configuration on the
# edge nodes, and sipbench's mock backend behind them. hack/kind.sh applies it after the operator
# (deploy/kind/operator).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telephony
resources:
  - namespace.yaml
  - ../../sipbench/k8s
  - kamailio-sip.yaml
  - freeswitchcluster.yaml
  - kamailiocluster.yaml
