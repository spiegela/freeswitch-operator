# A local edge: two proxy nodes for Kamailio and three tainted edge nodes for FreeSWITCH, one pod per node on the
# host network, as on the real edge node groups. Everything else (the operator, the bench) runs on the proxy nodes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: freeswitch-operator
# Every kubelet syncs its pods every 10 s (the default is a minute), so a changed ConfigMap, the dispatcher list
# above all, reaches the mounted files within seconds; the KamailioCluster's reloadDelaySeconds counts on it.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    syncFrequency: 10s
nodes:
  - role: control-plane
  - role: worker
    labels: {node-role.example.com/sip-proxy: "true"}
  - role: worker
    labels: {node-role.example.com/sip-proxy: "true"}
  - &edge
    role: worker
    labels: {node-role.example.com/sip-edge: "true"}
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - {key: node-role.example.com/sip-edge, value: "true", effect: NoSchedule}
  - *edge
  - *edge
