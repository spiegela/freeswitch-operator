# The edge's shared PostgreSQL on kind: FreeSWITCH's core db (channels, calls, registrations) and sofia's call
# tracking (the recovery table), which another node reads to `sofia recover` a lost node's calls. One small instance
# on a proxy node. A managed PostgreSQL (Aurora, say) works the same way: only the connection settings change
# (deploy/kind/freeswitchcluster.yaml: CORE_DB_DSN and PGPASSWORD).
apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  # kind only: a throwaway local value. On a real cluster this Secret comes from the cloud's secret store.
  password: freeswitch-kind
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      nodeSelector:
        node-role.example.com/sip-proxy: "true"
      # Postgres's own user in the alpine image (uid and gid 70); the entrypoint runs as it without root.
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
          ports:
            - {name: postgres, containerPort: 5432}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, value: freeswitch}
            - {name: POSTGRES_USER, value: freeswitch}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres, key: password}}
            # A subdirectory: the volume's root may hold lost+found, which initdb refuses.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          # Sized for a few nodes' core dbs: each FreeSWITCH keeps a handful of connections.
          args: ["-c", "max_connections=100", "-c", "shared_buffers=64MB"]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "freeswitch", "-d", "freeswitch"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
