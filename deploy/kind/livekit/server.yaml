# The LiveKit server: rooms, signalling (7880, behind the livekit-server Service) and WebRTC media. It advertises its
# pod address (NODE_IP) as its only ICE candidate, so media works from the pod network (LiveKit SIP, the agent).
# The server reads its config at start only: roll it after a change (kubectl -n livekit rollout restart
# deploy/livekit-server).
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-server-config
data:
  config.yaml: |
    port: 7880
    log_level: info
    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: false
    redis:
      address: valkey.livekit.svc.cluster.local:6379
    prometheus:
      port: 6789
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-server
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: livekit-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: livekit-server}
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: livekit-server
          image: livekit/livekit-server:v1.13.11
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/livekit/config.yaml"]
          env:
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          envFrom:
            - secretRef: {name: livekit-api}
          ports:
            - {name: http, containerPort: 7880}
            - {name: rtc-tcp, containerPort: 7881}
            - {name: rtc-udp, containerPort: 7882, protocol: UDP}
            - {name: metrics, containerPort: 6789}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/livekit}
      volumes:
        - name: config
          configMap: {name: livekit-server-config}
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-server
spec:
  selector: {app.kubernetes.io/name: livekit-server}
  ports:
    - {name: http, port: 7880, targetPort: http}
