# The API key and secret the server accepts and LiveKit SIP and the stand-in agent sign with. A fixed development
# pair, for kind only.
apiVersion: v1
kind: Secret
metadata:
  name: livekit-api
stringData:
  LIVEKIT_API_KEY: devkey
  LIVEKIT_API_SECRET: kind-development-secret-not-for-real-use
  # The server's form: "key: secret" lines.
  LIVEKIT_KEYS: "devkey: kind-development-secret-not-for-real-use"
