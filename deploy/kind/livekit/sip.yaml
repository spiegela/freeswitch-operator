# LiveKit SIP, patched: takes the calls the edge bridges here ("lk<number>"; the FreeswitchCluster's LIVEKIT_HOST)
# and joins each caller to a LiveKit room as a participant. It advertises its pod address for SIP and RTP, which
# FreeSWITCH (on the node's network) reaches directly. info_topics forwards each SIP INFO of the edge's barge-in
# type to the room as a data packet on the topic barge-in; INFOs of other types get 415.
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-sip
data:
  config.yaml: |
    ws_url: ws://livekit-server.livekit.svc.cluster.local:7880
    redis:
      address: valkey.livekit.svc.cluster.local:6379
    sip_port: 5060
    rtp_port: 10000-10099
    use_external_ip: false
    health_port: 8080
    prometheus_port: 6790
    logging:
      level: info
    info_topics:
      application/x-barge-in+json: barge-in
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-sip
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: livekit-sip}
  template:
    metadata:
      labels: {app.kubernetes.io/name: livekit-sip}
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: livekit-sip
          image: livekit-sip:info-dev  # hack/kind.sh livekit loads LIVEKIT_SIP_IMAGE under this name
          imagePullPolicy: IfNotPresent
          # The API key and secret come from the environment (LIVEKIT_API_KEY, LIVEKIT_API_SECRET).
          envFrom:
            - secretRef: {name: livekit-api}
          ports:
            - {name: sip-udp, containerPort: 5060, protocol: UDP}
            - {name: sip-tcp, containerPort: 5060}
            - {name: health, containerPort: 8080}
            - {name: metrics, containerPort: 6790}
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /sip}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: livekit-sip}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-sip
spec:
  selector: {app.kubernetes.io/name: livekit-sip}
  ports:
    - {name: sip-udp, port: 5060, targetPort: sip-udp, protocol: UDP}
    - {name: sip-tcp, port: 5060, targetPort: sip-tcp}
