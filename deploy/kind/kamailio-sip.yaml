# One load-balanced address for in-cluster callers to reach Kamailio's SIP port. The sipbench runner uses
# proxy-kamailio (the headless Service: each node's own address) instead, as peers outside do, because a call that
# sends its in-dialog requests from the INVITE's socket can't go through this VIP (see sipbench/k8s/runner-job.yaml).
apiVersion: v1
kind: Service
metadata:
  name: kamailio-sip
spec:
  selector:
    sip.instruments.com/kamailio-cluster: proxy
  ports:
    - {name: sip-udp, port: 5060, targetPort: 5060, protocol: UDP}
    - {name: sip-tcp, port: 5060, targetPort: 5060, protocol: TCP}
