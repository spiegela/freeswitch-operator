# One name for in-cluster callers (the sipbench runner) to reach Kamailio's SIP port. Peers outside reach each
# Kamailio on its node's own address instead.
apiVersion: v1
kind: Service
metadata:
  name: kamailio-sip
spec:
  selector:
    sip.instruments.com/kamailio-cluster: proxy
  ports:
    - {name: sip-udp, port: 5060, targetPort: 5060, protocol: UDP}
    - {name: sip-tcp, port: 5060, targetPort: 5060, protocol: TCP}
