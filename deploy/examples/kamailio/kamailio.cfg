#!KAMAILIO
#
# Example Kamailio config for a freeswitch-operator edge. Kamailio holds the fixed signaling address and spreads
# new calls across the FreeSWITCH fleet with the dispatcher module. The operator keeps the dispatcher list (a
# mounted ConfigMap) in step with the fleet's ready members and drives this Kamailio over JSON-RPC.
#
# Preprocessor values, set on the command line with -A:
#   DS_SETID       dispatcher set of the fleet (matches spec.dispatcher.setID)   default 1
#   PUBLIC_ADDR    the address advertised in Via and Record-Route, e.g. -A 'PUBLIC_ADDR=203.0.113.10': the node's
#                  public address, or its own where nothing translates it. Set it: without it Record-Route
#                  carries 0.0.0.0 and no ACK or BYE can follow the dialog (deployment.yaml always sets it).
#   RPC_PORT       the internal port for JSON-RPC over HTTP                        default 5070

#!ifndef DS_SETID
#!define DS_SETID 1
#!endif
#!ifndef RPC_PORT
#!define RPC_PORT 5070
#!endif
#!define DISPATCHER_LIST "/etc/kamailio/dispatcher/dispatcher.list"

debug=2
log_stderror=yes
children=4
tcp_accept_no_cl=yes
auto_aliases=no

#!ifdef PUBLIC_ADDR
listen=udp:0.0.0.0:5060 advertise PUBLIC_ADDR:5060
listen=tcp:0.0.0.0:5060 advertise PUBLIC_ADDR:5060
#!else
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
#!endif
# JSON-RPC for the operator. Keep this port closed to the outside (security group); the route below also refuses
# HTTP on any other port.
listen=tcp:0.0.0.0:RPC_PORT

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "dispatcher.so"
loadmodule "xhttp.so"
loadmodule "jsonrpcs.so"

# The list is a ConfigMap mounted as a directory (never with subPath, which does not update).
modparam("dispatcher", "list_file", DISPATCHER_LIST)
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_ping_interval", 10)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_probing_threshold", 2)
modparam("dispatcher", "ds_inactive_threshold", 2)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=403;code=404;code=405")
modparam("dispatcher", "xavp_dst", "_dsdst_")

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 60000)

modparam("jsonrpcs", "pretty_format", 1)
# HTTP only (via xhttp). The default leaves HTTP off, and jsonrpc_dispatch() then drops each request unanswered.
modparam("jsonrpcs", "transport", 1)

request_route {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		exit;
	}

	# Requests inside a dialog follow its route set.
	if (has_totag()) {
		if (loose_route()) {
			route(RELAY);
		}
		if (is_method("ACK") && t_check_trans()) {
			route(RELAY);
		}
		sl_send_reply("404", "Not Here");
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}
	if (t_precheck_trans()) {
		t_check_trans();
		exit;
	}
	t_check_trans();

	# Keepalives addressed to us.
	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
		sl_send_reply("200", "OK");
		exit;
	}

	remove_hf("Route");
	record_route();

	# From a FreeSWITCH node toward a peer: relay to the request URI, from our fixed address.
	if (ds_is_from_list(DS_SETID)) {
		route(RELAY);
	}

	# From a peer: pick a FreeSWITCH node, round-robin, failing over on 503 or no answer.
	if (!ds_select_dst(DS_SETID, "4")) {
		sl_send_reply("503", "No FreeSWITCH Available");
		exit;
	}
	t_on_failure("DS_FAILOVER");
	route(RELAY);
}

route[RELAY] {
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

# A paused (draining) FreeSWITCH answers new calls with 503; a dead one doesn't answer. Either way, try the next.
failure_route[DS_FAILOVER] {
	if (t_is_canceled()) {
		exit;
	}
	if (t_check_status("503") || (t_branch_timeout() && !t_branch_replied())) {
		ds_mark_dst("ip");
		if (ds_next_dst()) {
			t_on_failure("DS_FAILOVER");
			route(RELAY);
		}
	}
}

event_route[xhttp:request] {
	if ($Rp != RPC_PORT) {
		xhttp_reply("403", "Forbidden", "text/plain", "forbidden\n");
		exit;
	}
	if ($hu =~ "^/RPC") {
		jsonrpc_dispatch();
		exit;
	}
	xhttp_reply("404", "Not Found", "text/plain", "not found\n");
}
