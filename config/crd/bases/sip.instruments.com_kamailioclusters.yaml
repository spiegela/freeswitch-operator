                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              externalAddress:
                description: |-
                  externalAddress says what each pod advertises in Via and Record-Route. A pod reads it once, when it
