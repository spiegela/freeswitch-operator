                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              rpc:
                default: {}
                description: rpc configures the operator's JSON-RPC port.
                properties:
                  port:
                    default: 5070
                    description: |-
                      port for JSON-RPC over HTTP. It listens on the pod's own address only, and every request needs the
                      token in the <name>-jsonrpc Secret. Keep it closed to the outside all the same.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              sip:
                default: {}
                description: sip configures the SIP port peers reach Kamailio on.
                properties:
                  port:
                    default: 5060
                    description: port is the SIP port of the profile Kamailio dispatches
                      to. With host networking it is opened on the node.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              tolerations:
                description: tolerations for those nodes.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              trustedPeers:
                description: |-
                  trustedPeers, when set, are the only sources Kamailio takes requests from, besides the FreeSWITCH nodes in
                  spec.dispatch: any request from another address (a new call, a keepalive, a request inside a dialog) is
                  dropped unanswered and counted in kamailio_rejected_requests_total{reason="untrusted_source"}. Empty trusts
                  every source. Changing this list rolls the Kamailio pods.

                  It guards signaling only. Media goes straight between peers and FreeSWITCH, so a firewall in front of the
                  FreeSWITCH nodes' RTP ports should admit the peers' media addresses, which often differ from these.
                items:
                  description: TrustedPeer is a SIP peer (a carrier, a PBX, a test
                    bench) whose addresses may start calls through Kamailio.
                  properties:
                    addresses:
                      description: addresses the peer's signaling comes from, as CIDRs
                        (IPv4 or IPv6; a single address is a /32 or /128).
                      items:
                        format: cidr
                        type: string
                      maxItems: 64
