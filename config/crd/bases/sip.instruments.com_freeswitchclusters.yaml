                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              externalAddress:
                description: externalAddress settings.
                properties:
                  required:
                    default: true
                    description: |-
                      required makes a pod unready until it has an external address, so it takes no calls it couldn't
