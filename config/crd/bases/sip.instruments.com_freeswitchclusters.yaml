                format: int64
                type: integer
              readyReplicas:
                description: readyReplicas is the number of pods ready to take calls.
                format: int32
                type: integer
              replicas:
                description: replicas is the number of pods that exist.
                format: int32
                type: integer
              updateRevision:
                description: updateRevision is the revision pods are being moved to.
                type: string
              updatedReplicas:
                description: updatedReplicas is the number of pods on the latest pod
