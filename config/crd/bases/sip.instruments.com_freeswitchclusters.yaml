                      type: string
                    externalAddress:
                      description: externalAddress the pod advertises to peers.
                      type: string
                    node:
                      description: node the pod runs on.
                      type: string
                    pod:
                      description: pod name.
                      type: string
                    revision:
                      description: revision of the pod template the pod runs.
                      type: string
                    state:
                      description: state of the member.
                      type: string
                  required:
