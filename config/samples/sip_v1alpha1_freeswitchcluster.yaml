apiVersion: sip.instruments.com/v1alpha1
kind: FreeswitchCluster
metadata:
  labels:
    app.kubernetes.io/name: freeswitch-operator
    app.kubernetes.io/managed-by: kustomize
  name: edge
spec:
  # One FreeSWITCH per node; keep one spare for updates and failover.
  replicas: 3
  # Any image with freeswitch, fs_cli and /bin/sh. This public image (FreeSWITCH 1.10.10, amd64 and arm64)
  # is the one sipbench tests against; build and pin your own once you need something it lacks.
  image: drachtio/drachtio-freeswitch-mrf:0.9.6@sha256:cb81acc1112990ca33693374f1de7443d44cf9c95e6ae6c02ba1edcee4b68bba
  # The config below is mounted read-only, and this image's entrypoint edits its config (sed -i) before starting,
  # so it would exit at once. Run the binary against the assembled config instead.
  command: ["/usr/local/freeswitch/bin/freeswitch"]
  args: ["-nonat", "-nf", "-nc", "-conf", "/usr/local/freeswitch/conf", "-log", "/tmp", "-db", "/tmp"]
  nodeSelector:
    node-role.example.com/sip-edge: "true"
  tolerations:
    - key: node-role.example.com/sip-edge
      operator: Exists
      effect: NoSchedule
  sip:
    port: 5060
  rtp:
    # Must match the edge node group's security group.
    portRangeStart: 16384
    portRangeEnd: 32768
  externalAddress:
    source: NodeExternalIP
    required: true
  config:
    # The directory FreeSWITCH reads (-conf). Each ConfigMap's keys become files in its own directory under it.
    mountPath: /usr/local/freeswitch/conf
    configMapRefs:
      - {name: edge-freeswitch-conf, path: "."}                  # freeswitch.xml, vars.xml
      - {name: edge-freeswitch-autoload, path: autoload_configs}
      - {name: edge-freeswitch-dialplan, path: dialplan}
      - {name: edge-freeswitch-profiles, path: sip_profiles}
  drain:
    maxDrainSeconds: 7200
  dispatcher:
    setID: 1
    configMapName: edge-dispatcher
    transport: udp
    # A KamailioCluster (sip_v1alpha1_kamailiocluster.yaml) reads this list and drives its own pods. Only a
    # Kamailio you run yourself needs jsonrpcURL here.
