# The agent reads the pools (cluster-scoped) and annotates its own pod; it touches no other object.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: address-agent
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: address-agent
rules:
  - apiGroups: [sip.instruments.com]
    resources: [sipaddresspools]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: address-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: address-agent
subjects:
  - kind: ServiceAccount
    name: address-agent
    namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: address-agent
  namespace: system
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: address-agent
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: address-agent
subjects:
  - kind: ServiceAccount
    name: address-agent
    namespace: system
