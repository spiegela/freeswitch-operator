apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: address-agent
  namespace: system
  labels:
    app.kubernetes.io/name: freeswitch-operator-address-agent
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: freeswitch-operator-address-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freeswitch-operator-address-agent
    spec:
      serviceAccountName: address-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 5
      containers:
        - name: agent
          image: controller:latest
          command: ["/address-agent"]
          args: ["--health-probe-bind-address=127.0.0.1:8082"]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            # status.hostIPs (all the node's addresses) picks the IPv4 one on a dual-stack node; hostIP is the fallback.
            - {name: HOST_IPS, valueFrom: {fieldRef: {fieldPath: status.hostIPs}}}
            - {name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
          securityContext:
            # Root for netlink in the host's network namespace, with NET_ADMIN and nothing else. Stopping the agent
            # leaves the addresses where they are: they may be carrying calls.
            runAsUser: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 96Mi}
