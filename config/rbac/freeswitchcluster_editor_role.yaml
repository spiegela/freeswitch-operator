# This rule is not used by the project freeswitch-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the sip.instruments.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: freeswitch-operator
    app.kubernetes.io/managed-by: kustomize
  name: freeswitchcluster-editor-role
rules:
- apiGroups:
  - sip.instruments.com
  resources:
  - freeswitchclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sip.instruments.com
  resources:
  - freeswitchclusters/status
  verbs:
  - get
