# This rule is not used by the project freeswitch-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to sip.instruments.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: freeswitch-operator
    app.kubernetes.io/managed-by: kustomize
  name: kamailiocluster-viewer-role
rules:
- apiGroups:
  - sip.instruments.com
  resources:
  - kamailioclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sip.instruments.com
  resources:
  - kamailioclusters/status
  verbs:
  - get
