# The edge's Grafana dashboards as ConfigMaps labeled grafana_dashboard=1, the label Grafana's dashboard sidecar
# (kube-prometheus-stack, victoria-metrics-k8s-stack) watches for by default. Set the namespace to the one the
# sidecar watches. The JSON is generated by hack/dashboards/dashboards.py (make dashboards): change that, not the
# JSON. Grafana's own $__rate_interval and ${datasource} look like Flux substitutions, so the ConfigMaps opt out.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Edge
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: edge-dashboard-kamailio
    files: [kamailio.json]
  - name: edge-dashboard-freeswitch
    files: [freeswitch.json]
  - name: edge-dashboard-freeswitch-operator
    files: [freeswitch-operator.json]
