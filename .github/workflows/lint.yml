name: Lint

# Pull requests, and main once they land. (Not every branch push too: a pull request's branch would run twice.)
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    name: Operator and sipbench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
      - name: Check the Kamailio config template with kamailio -c
        run: make check-kamailio-cfg
      - name: Check Kamailio's SIP capture (spec.capture) reaches a HEP collector
        run: make check-kamailio-capture
      - name: Check Kamailio gives FreeSWITCH its pod's name, with a bind address
        run: make check-kamailio-name
      - name: Check the alert rules and run their tests with promtool
        run: make check-alerts
