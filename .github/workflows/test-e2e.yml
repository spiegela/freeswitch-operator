name: E2E Tests

# Pull requests run the bench's short set (sipbench -short: everything but the scenarios marked long); main, release
# tags and a run by hand (Actions tab, or gh workflow run on a branch) run all of it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, and the kind release also fixes the Kubernetes node image. Bump on purpose.
  KIND_VERSION: v0.33.0

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Operator deploys and serves metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # go install checks the module against the Go checksum database, so the pinned version is the one we get.
      - name: Install kind
        run: |
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run the e2e tests
        run: make test-e2e

  edge-on-kind:
    permissions:
      contents: read
    name: Edge on kind, sipbench through Kamailio
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Six nodes outrun the runner's default inotify limits, and kube-proxy on the workers then can't start, so pods
      # there can't reach Service IPs (the API server's included). Kind's known issues give these values.
      - name: Raise inotify limits for a six-node cluster
        run: sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288

      # Go's module and build caches for the image builds (BuildKit cache mounts in both Dockerfiles), carried between
      # runs so a build compiles only what changed. Pushes to main save them; pull requests only restore main's, so
      # they don't spend time extracting and uploading them.
      - name: Restore the image builds' Go caches
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image-go-mod
            image-go-build
          key: image-go-${{ runner.arch }}-${{ hashFiles('go.sum', 'sipbench/go.sum') }}-${{ github.sha }}
          restore-keys: image-go-${{ runner.arch }}-

      - name: Restore and save the image builds' Go caches
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image-go-mod
            image-go-build
          key: image-go-${{ runner.arch }}-${{ hashFiles('go.sum', 'sipbench/go.sum') }}-${{ github.sha }}
          restore-keys: image-go-${{ runner.arch }}-

      - name: Hand the Go caches to BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {"image-go-mod": "/go/pkg/mod", "image-go-build": "/root/.cache/go-build"}
          skip-extraction: ${{ github.event_name == 'pull_request' }}

      # The images build while kind starts the nodes; deploy then finds them in the build cache.
      - name: Create the cluster and build the images
        run: |
          hack/kind.sh images & images=$!
          make kind-up
          wait "$images"

      - name: Deploy the operator, Kamailio, the FreeswitchCluster and the bench
        run: make kind-deploy

      - name: Run sipbench
        env:
          SIPBENCH_SHORT: ${{ github.event_name == 'pull_request' }}
          # Scenarios that leave the edge and the network alone run four at a time, ahead of the rest.
          SIPBENCH_PARALLEL: "4"
        run: make kind-bench

      - name: Show the cluster's state
        if: failure()
        run: |
          k() { kubectl --context kind-freeswitch-operator "$@"; }
          hack/kind.sh status || true
          k get pods -A -o wide || true
          k get events -A --sort-by=.lastTimestamp | tail -n 100 || true
          echo "== kube-proxy (previous run of each, if it restarted)"
          k -n kube-system logs -l k8s-app=kube-proxy --prefix --previous --tail=30 || true
          k -n kube-system logs -l k8s-app=kube-proxy --prefix --tail=30 || true
          k -n freeswitch-operator-system logs deployment/freeswitch-operator-controller-manager --tail=200 || true
          for p in $(k -n telephony get pods -o name); do
            echo "== $p"
            k -n telephony logs "$p" --all-containers --tail=100 || true
          done
